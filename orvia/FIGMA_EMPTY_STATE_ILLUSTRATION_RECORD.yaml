relationship_candidates:
  - id: ESI-REL-001
    type: SEMANTIC_FIT
    statement: "Choose metaphor mode from the state semantics before styling. A permission state, no-result state, and transactional failure need not share the same narrative construction."
    source_records: [ESI-OBS-001, ESI-OBS-002, ESI-OBS-003, ESI-OBS-004]

  - id: ESI-REL-002
    type: COMPLEXITY_CAP
    statement: "If the semantic state can be conveyed by one recognizable object, additional narrative layers should require a reason rather than being added by default."
    provenance: ORVIA_INFERENCE
    source_records: [ESI-OBS-001, ESI-OBS-004]

  - id: ESI-REL-003
    type: ACCENT_DISCIPLINE
    statement: "The directly rendered samples suggest keeping accent emphasis localized instead of distributing saturated color across the full illustration."
    provenance: ORVIA_INFERENCE
    source_records: [ESI-OBS-001, ESI-OBS-002, ESI-OBS-003, ESI-OBS-004]

orvia_mapping:
  DESIGN_VARIANCE:
    support: STYLE_REFERENCE_ONLY
    note: "The kit offers metaphor and composition references but no quantitative distinctiveness scale."

  VISUAL_DENSITY:
    support: PARTIAL_VISUAL_EVIDENCE
    note: "Illustration internal density can be measured, but this is not equivalent to page-level VISUAL_DENSITY."

  IMAGE_DOMINANCE:
    support: PARTIAL_VISUAL_EVIDENCE
    note: "An empty-state illustration's footprint can be measured relative to its slot once the host UI is known."

  INTERACTION_EXPLICITNESS:
    support: NON_EQUIVALENT
    note: "These illustrations communicate state semantics; they do not by themselves establish affordance clarity."

  CONTENT_DISCLOSURE:
    support: NON_EQUIVALENT
    note: "The source is an illustration kit, not a disclosure-pattern specification."

governance:
