orvia_mapping:
  MOTION_TEMPO:
    evidence:
      - MCA-001
      - MCA-002
      - MCA-003
    relationship: "Material provides deterministic duration, easing, and spring token families that can resolve a desired ORVIA tempo into implementation values."
    mapping_status: TOKEN_RESOLUTION_EVIDENCE
    caution: "Do not equate one duration token with one ORVIA 1..10 value without context."

  MOTION_INTENSITY:
    evidence:
      - MCA-003
    relationship: "Spring profile character may influence perceived motion intensity, but spatial magnitude/frequency remain separate."
    mapping_status: PARTIAL_IMPLEMENTATION_EVIDENCE

  SURFACE_DEPTH:
    evidence:
      - MCA-004
    relationship: "Elevation levels provide a source-native implementation ladder for depth."
    mapping_status: TOKEN_RESOLUTION_EVIDENCE

  CORNER_ROUNDNESS:
