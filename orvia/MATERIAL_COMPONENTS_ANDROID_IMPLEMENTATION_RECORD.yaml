      - MCA-005
    relationship: "Corner-size scale provides a source-native shape ladder."
    mapping_status: TOKEN_RESOLUTION_EVIDENCE

  INTERACTION_EXPLICITNESS:
    evidence:
      - MCA-006
      - MCA-009
    relationship: "State layers and focus rings provide implementation evidence for visible interactive-state feedback."
    mapping_status: PARTIAL_IMPLEMENTATION_EVIDENCE

  INPUT_PRECISION_DEMAND:
    evidence:
      - MCA-007
    relationship: "48dp minimum target implementation can serve as Android-specific evidence when evaluating target geometry."
    mapping_status: PLATFORM_SPECIFIC_EVIDENCE

  VISUAL_DENSITY:
    evidence:
      - MCA-007
      - MCA-008
    relationship: "Component size-class coupling and target floors constrain how far density may be compressed."
    mapping_status: RELATIONSHIP_EVIDENCE

